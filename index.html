<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>بایگانی گروه صدری</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&family=Noto+Naskh+Arabic:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one narrow records-terminal column. Search on top, opened records stack below, newest first. */
:root{
  --bg:#0f1112;--panel:#171a1b;--line:#2a2f30;--ink:#d9d6cc;--muted:#8b8f8a;
  --paper:#e8e2d2;--paper-ink:#2b2620;--seal:#b3352b;--ok:#6fae7a;
  --font-ui:"Vazirmatn",Tahoma,sans-serif;--font-doc:"Noto Naskh Arabic","Vazirmatn",serif;--font-mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font-ui);font-size:16px;line-height:1.75}
.wrap{direction:rtl;max-width:720px;margin:0 auto;padding-block:24px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
header.mast{display:flex;flex-direction:column;gap:4px;border-bottom:1px solid var(--line);padding-bottom:14px}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;color:var(--muted);direction:ltr;text-align:right}
h1{font-weight:800;font-size:26px;margin:0;text-wrap:balance}
h2{font-weight:600;font-size:18px;margin:0}
h3{font-weight:600;font-size:16px;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.search{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
form.code{display:flex;gap:8px;flex-wrap:wrap}
input[type=text]{flex:1 1 180px;min-width:0;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:10px 12px;font-family:var(--font-ui);font-size:17px}
input[type=text]:focus{outline:2px solid var(--ink);outline-offset:1px}
button{font-family:var(--font-ui);font-size:15px;background:var(--ink);color:var(--bg);border:0;border-radius:4px;padding:10px 18px;cursor:pointer}
button:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);padding:6px 12px;font-size:13px}
button:disabled{opacity:.4;cursor:not-allowed}
.msg{font-size:14px;min-height:1.4em}
.msg.bad{color:#e07a6e}.msg.good{color:var(--ok)}
.records{display:flex;flex-direction:column;gap:18px}
.rec{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px}
.rec.new{border-color:var(--ink)}
.rec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.tag{font-family:var(--font-mono);font-size:11px;padding:2px 8px;border-radius:3px;border:1px solid var(--line);color:var(--muted);direction:ltr}
.doc{background:var(--paper);color:var(--paper-ink);font-family:var(--font-doc);border-radius:2px;padding:18px;line-height:2;display:flex;flex-direction:column;gap:8px}
.doc .meta{font-family:var(--font-ui);font-size:12px;opacity:.7}
.stamp{align-self:flex-start;border:2px solid var(--seal);color:var(--seal);font-family:var(--font-ui);font-weight:800;font-size:12px;padding:2px 10px;transform:rotate(-4deg)}
.tbl{overflow-x:auto}
table{color:inherit;font-size:inherit;border-collapse:collapse;width:100%;font-size:14px;font-family:var(--font-ui)}
th,td{border-bottom:1px solid rgba(43,38,32,.25);padding:6px;text-align:right;vertical-align:top}
th{font-weight:600;font-size:12px;opacity:.75}
.num{font-family:var(--font-mono);direction:ltr;unicode-bidi:isolate}
.order{border:1px solid var(--seal);background:rgba(179,53,43,.1);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.order b{color:#ecaaa2}
.hints{display:flex;flex-direction:column;gap:6px}
.hint{font-size:14px;color:var(--muted);border-right:2px solid var(--line);padding-right:10px}
.tape{background:#0a0b0b;border:1px solid var(--line);border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:8px;font-family:var(--font-doc)}
.tape .h{font-family:var(--font-mono);font-size:12px;color:var(--muted);direction:ltr;text-align:right}
.tape .n{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.tape .v1{color:#d9c48e}.tape .v2{color:#9ec3d6}.tape .v3{color:#e2a4c0}
.clips{display:flex;flex-direction:column;gap:16px}
.clip{display:flex;flex-direction:column;gap:6px}
.clip canvas{width:100%;max-width:100%;aspect-ratio:16/9;background:#000;border-radius:3px;display:block}
.clip-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.q{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.opts{display:flex;flex-direction:column;gap:6px}
.opts button{background:transparent;color:var(--ink);border:1px solid var(--line);text-align:right;padding:9px 12px}
.opts button:hover:not(:disabled){border-color:var(--ink)}
.letter{font-family:var(--font-doc);font-size:18px;line-height:2.1;display:flex;flex-direction:column;gap:14px}
footer{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>

<div class="wrap">
  <header class="mast">
    <span class="eyebrow">SADRI GROUP · RECORDS ARCHIVE</span>
    <h1>بایگانی اسناد گروه صدری</h1>
    <p class="muted">برای دیدن پرونده، شناسه آن را جستجو کنید.</p>
  </header>

  <div class="search">
    <form class="code" id="search"><input type="text" id="q" autocomplete="off" placeholder="شناسه را وارد کنید" aria-label="جستجوی شناسه"><button type="submit">جستجو</button></form>
    <p class="msg" id="smsg" aria-live="polite"></p>
  </div>

  <section class="rec" id="hintbox">
    <div class="rec-head"><h3>گیر کرده‌اید؟</h3></div>
    <div class="hints" id="hints"></div>
  </section>

  <div class="records" id="records"></div>

  <section class="rec" id="final" hidden><div id="final-qs"></div><div id="final-letter" hidden></div></section>

  <footer><span class="num">ARCHIVE v4.0</span><button type="button" class="ghost" id="reset">شروع دوباره</button></footer>
</div>

<script>
(function(){
  function norm(s){
    var fa='۰۱۲۳۴۵۶۷۸۹',ar='٠١٢٣٤٥٦٧٨٩';
    return (s||'').replace(/[۰-۹]/g,function(d){return fa.indexOf(d)}).replace(/[٠-٩]/g,function(d){return ar.indexOf(d)})
      .replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/[\s‌\-\.\/\\•·_+,:]/g,'').toLowerCase();
  }
  var S={found:[],hints:{}};
  try{var raw=JSON.parse(localStorage.getItem('sadri-v4')||'null');if(raw&&raw.found)S=raw}catch(e){}
  function save(){try{localStorage.setItem('sadri-v4',JSON.stringify(S))}catch(e){}}

  function order(code,label,extra){return '<div class="order"><b>پاکت «'+code+'» را باز کنید.</b><span>'+label+'</span>'+(extra?'<span>'+extra+'</span>':'')+'</div>'}

  var R={
    acc8347:{keys:['8347'],tag:'ACC ••8347',title:'حساب <span class="num">••8347</span> و گزارش حسابرسی',html:
      '<div class="doc"><span class="stamp">محرمانه</span><b style="font-family:var(--font-ui)">گزارش حسابرسی داخلی، گروه صدری</b><span class="meta">۱۰ دسامبر ۲۰۲۵</span>'+
      '<p><b>یافته ۱.</b> از مارس ۱۹۹۲ تا اکتبر ۲۰۲۵ هر ماه مبلغی ثابت به حساب <span class="num">••8347</span> رفته است. صاحب این حساب در دفاتر نیامده. در دفاتر فعلی این پرداخت‌ها «هزینه مشاوره» ثبت شده‌اند، اما هیچ قرارداد مشاوره‌ای وجود ندارد.</p>'+
      '<p><b>یافته ۲.</b> دستور این پرداخت ماهانه را در سال ۱۹۹۲ <b>کارمند شماره <span class="num">0412</span></b> ثبت کرده است، به دستور شخص مدیرعامل.</p>'+
      '<p><b>یافته ۳.</b> دفاتر ۲۰۲۳ تا ۲۰۲۵ در ۲۰ اکتبر ۲۰۲۵ ویرایش شده‌اند، شش روز بعد از فوت مدیرعامل. نام ویرایش‌کننده ثبت نشده.</p>'+
      '<p><b>یافته ۴.</b> یک روز بعد، انتقال <span class="num">TR-882</span> به مبلغ ۸۵٬۰۰۰ یورو به حساب شخصی <span class="num">••5521</span> انجام شده، با عنوان «خرید تجهیزات IT». هیچ فاکتوری نیست. تأییدکننده: ش. صدری.</p></div>'+
      '<div class="doc"><b style="font-family:var(--font-ui)">فهرست کارکنان سابق</b><div class="tbl"><table><thead><tr><th>شماره کارمند</th><th>نام</th><th>سال‌ها</th></tr></thead><tbody>'+
      '<tr><td class="num">0388</td><td>داوود فرهمند</td><td class="num">1992–2018</td></tr>'+
      '<tr><td class="num">0412</td><td>فرانک رادمنش</td><td class="num">1988–1993</td></tr>'+
      '<tr><td class="num">0457</td><td>سیما کاظمی</td><td class="num">1993–2009</td></tr>'+
      '<tr><td class="num">0420</td><td>رضا مقدم</td><td class="num">1998–2015</td></tr>'+
      '<tr><td class="num">0731</td><td>نوید صالحی</td><td class="num">2012–2023</td></tr></tbody></table></div></div>'}
  };
  var ORDER_FINAL=['mother'];

  var HINTS=[
    ['شماره حسابی که هر ماه پول می‌گرفت، در صورت‌حساب ناقص است.','پشت عکس سوخته را نگاه کنید. دو رقم آنجاست.','دو رقم پشت عکس، بعد دو رقم آخر حساب. جستجو کنید: ۸۳۴۷'],
    []
  ];
  function stage(){var f=S.found;var has=function(k){return f.indexOf(k)>-1};
    if(!has('acc8347'))return 0;return 1}
  function renderHints(){
    var st=stage(),box=document.getElementById('hints');box.innerHTML='';
    document.getElementById('hintbox').hidden=!HINTS[st].length;
    var list=HINTS[st],n=S.hints[st]||0;
    for(var i=0;i<n&&i<list.length;i++){var p=document.createElement('p');p.className='hint';p.textContent='راهنمایی '+(i+1)+': '+list[i];box.appendChild(p)}
    if(n<list.length){var b=document.createElement('button');b.type='button';b.className='ghost';b.textContent=n?'راهنمایی بیشتر':'یک راهنمایی بدهید';
      b.addEventListener('click',function(){S.hints[st]=n+1;save();renderHints()});box.appendChild(b)}
  }

  function cooldown(els,msg,sec){
    els.forEach(function(e){e.disabled=true});var t=sec;msg.className='msg bad';
    msg.textContent='نه. '+t+' ثانیه صبر کنید.';
    var iv=setInterval(function(){t--;if(t<=0){clearInterval(iv);els.forEach(function(e){e.disabled=false});msg.textContent=''}else msg.textContent='نه. '+t+' ثانیه صبر کنید.'},1000);
  }

  function findRecord(q){
    var n=norm(q);if(!n)return null;
    for(var id in R){if(R[id].keys.indexOf(n)>-1)return id}

    return null;
  }
  var lastNew=null;
  document.getElementById('search').addEventListener('submit',function(e){
    e.preventDefault();var inp=document.getElementById('q'),msg=document.getElementById('smsg');
    var id=findRecord(inp.value);
    if(!id){msg.className='msg bad';msg.textContent='رکوردی پیدا نشد.';return}
    if(R[id].needs&&S.found.indexOf(R[id].needs)<0){msg.className='msg bad';msg.textContent='این پرونده قفل است. کارت حافظه فقط با رمز سیستم خانه باز می‌شود.';return}
    msg.className='msg good';
    if(S.found.indexOf(id)>-1){msg.textContent='این پرونده قبلاً باز شده. پایین‌تر است.'}
    else{S.found.push(id);save();msg.textContent='پرونده باز شد.'}
    lastNew=id;inp.value='';render();
    var el=document.getElementById('r-'+id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
  });

  function render(){
    var box=document.getElementById('records');box.innerHTML='';
    S.found.slice().reverse().forEach(function(id){
      var r=R[id];var d=document.createElement('section');d.className='rec'+(id===lastNew?' new':'');d.id='r-'+id;
      d.innerHTML='<div class="rec-head"><h2>'+r.title+'</h2><span class="tag">'+r.tag+'</span></div>'+r.html;
      box.appendChild(d);
    });
    var lock=document.querySelector('form[data-lock="cams"]');
    if(lock){
      if(S.found.indexOf('cams')>-1){lock.hidden=true;lock.nextElementSibling.className='msg good';lock.nextElementSibling.textContent='نسخه پشتیبان باز شد.'}
      else lock.addEventListener('submit',function(e){e.preventDefault();var inp=lock.querySelector('input');var v=norm(inp.value);
        if(v==='0403'||v==='04031992'||v==='4031992'){S.found.push('cams');save();lastNew='cams';render();var el=document.getElementById('r-cams');if(el)el.scrollIntoView({behavior:'smooth'})}
        else cooldown([inp,lock.querySelector('button')],lock.nextElementSibling,15)});
    }
    if(S.found.indexOf('cams')>-1)buildClips();
    var fin=S.found.indexOf('mother')>-1;document.getElementById('final').hidden=!fin;if(fin)renderFinal();
    renderHints();
  }

  // ---------- final ----------
  var FINAL=[];
  function renderFinal(){
    var wrap=document.getElementById('final-qs');wrap.innerHTML='';var done=S.fin||0;
    for(var i=0;i<FINAL.length&&i<=done;i++)(function(i){
      var q=FINAL[i],d=document.createElement('div');d.className='q';
      var t=document.createElement('h3');t.textContent=(i+1)+'. '+q[0];d.appendChild(t);
      var o=document.createElement('div');o.className='opts';var msg=document.createElement('p');msg.className='msg';var btns=[];
      q[1].forEach(function(txt,j){var b=document.createElement('button');b.type='button';b.textContent=txt;btns.push(b);o.appendChild(b);
        if(i<done){b.disabled=true;if(j===q[2]){b.style.borderColor='var(--ok)';b.style.opacity=1}}
        else b.addEventListener('click',function(){if(j===q[2]){S.fin=i+1;save();renderFinal()}else cooldown(btns,msg,12)})});
      d.appendChild(o);d.appendChild(msg);wrap.appendChild(d)})(i);
    document.getElementById('final-letter').hidden=done<FINAL.length;
  }

  document.getElementById('reset').addEventListener('click',function(){var b=this;
    if(b.dataset.armed){S={found:[],hints:{}};save();lastNew=null;render();b.textContent='شروع دوباره';delete b.dataset.armed;window.scrollTo(0,0);return}
    b.dataset.armed='1';b.textContent='مطمئنید؟ دوباره بزنید';setTimeout(function(){delete b.dataset.armed;b.textContent='شروع دوباره'},5000)});

  // ---------- CCTV ----------
  var CLIPS=[
    {n:1,cam:'CAM 02  HALL',start:[22,40,12],dur:8,bg:'hall',actors:[{c:'plain',crouch:true,paint:true,k:[[0,220,1],[8,232,1]]}]},
    {n:2,cam:'CAM 02  HALL',start:[23,4,6],dur:9,bg:'hall',actors:[{c:'cloak',k:[[0,-40,1],[5.5,402,1],[6.6,402,0]]}]},
    {n:3,cam:'CAM 05  GARDEN',start:[23,4,34],dur:8,bg:'garden',actors:[{c:'cloak',k:[[0,250,1],[8,262,1]],smoke:true}]},
    {n:4,cam:'CAM 02  HALL',start:[23,10,1],dur:12,bg:'hall',cut:[6,[23,16,24]],actors:[
      {c:'plain',k:[[0,-40,1],[4.8,402,1],[5.6,402,0],[12,402,0]],carry:[0,5.6]},
      {c:'plain',k:[[0,402,0],[6.4,402,0],[7,402,1],[9,-60,1],[12,-60,1]]}]},
    {n:5,cam:'CAM 02  HALL',start:[23,14,40],dur:8,bg:'hall',actors:[{c:'plain',k:[[0,566,0],[0.8,566,1],[1.6,560,1],[2.4,566,1],[6.5,700,1],[8,700,1]]}]},
    {n:6,cam:'CAM 02  HALL',start:[23,25,10],dur:8,bg:'hall',actors:[{c:'cloak',k:[[0,690,1],[5,402,1],[6,402,0]]}]},
    {n:7,cam:'CAM 07  KITCHEN',start:[23,50,31],dur:12,bg:'kitchen',actors:[{c:'plain',crouchUntil:3.4,k:[[0,520,0],[1.6,520,0],[2.2,510,1],[3.4,500,1],[4.2,490,1],[4.8,505,1],[5.6,488,1],[8.4,150,1],[9.4,150,1],[11.4,-50,1]],carry:[2,9]}]},
    {n:8,cam:'CAM 03  WASHROOM',start:[23,55,2],dur:8,bg:'wash',actors:[{c:'plain',wash:true,k:[[0,330,1],[8,330,1]]}]}
  ];
  var built=false;
  function buildClips(){
    var box=document.getElementById('clips');if(!box)return;box.innerHTML='';
    CLIPS.forEach(function(cl){
      var d=document.createElement('div');d.className='clip';
      var cv=document.createElement('canvas');cv.width=640;cv.height=360;cv.setAttribute('aria-label','فیلم دوربین '+cl.n);
      var bar=document.createElement('div');bar.className='clip-bar';var lab=document.createElement('span');lab.textContent='فیلم '+cl.n;
      var btn=document.createElement('button');btn.type='button';btn.className='ghost';btn.textContent='پخش';
      bar.appendChild(lab);bar.appendChild(btn);d.appendChild(cv);d.appendChild(bar);box.appendChild(d);
      var st={t:0,playing:false,last:0};draw(cv,cl,0);
      btn.addEventListener('click',function(){
        if(st.playing){st.playing=false;btn.textContent='پخش';return}
        if(st.t>=cl.dur)st.t=0;st.playing=true;btn.textContent='توقف';st.last=performance.now();
        requestAnimationFrame(function loop(now){if(!st.playing||!cv.isConnected)return;st.t+=(now-st.last)/1000;st.last=now;
          if(st.t>=cl.dur){st.t=cl.dur;st.playing=false;btn.textContent='پخش دوباره';draw(cv,cl,st.t);return}
          draw(cv,cl,st.t);requestAnimationFrame(loop)});
      });
    });
  }
  function lerpK(k,t){if(t<=k[0][0])return k[0];
    for(var i=1;i<k.length;i++){if(t<=k[i][0]){var a=k[i-1],b=k[i],u=(t-a[0])/(b[0]-a[0]);return [t,a[1]+(b[1]-a[1])*u,a[2]+(b[2]-a[2])*u]}}
    return k[k.length-1]}
  function pad(n){return (n<10?'0':'')+n}
  function stamp(cl,t){var s=cl.start,off=t;if(cl.cut&&t>=cl.cut[0]){s=cl.cut[1];off=t-cl.cut[0]}
    var sec=s[0]*3600+s[1]*60+s[2]+Math.floor(off);return '31-10-2025  '+pad(Math.floor(sec/3600)%24)+':'+pad(Math.floor(sec/60)%60)+':'+pad(sec%60)}
  function figure(g,x,y,a,o,t){
    g.save();g.globalAlpha=a;g.fillStyle='#050505';
    var hgt=o.crouch?70:120,top=y-hgt;
    g.beginPath();g.arc(x,top+12,12,0,Math.PI*2);g.fill();
    if(o.cloak){g.beginPath();g.moveTo(x-10,top+20);g.lineTo(x+10,top+20);g.lineTo(x+26,y);g.lineTo(x-26,y);g.closePath();g.fill();
      g.beginPath();g.moveTo(x-14,top+16);g.quadraticCurveTo(x,top-14,x+14,top+16);g.fill()}
    else{g.fillRect(x-14,top+24,28,hgt*0.5);g.fillRect(x-12,top+24+hgt*0.5,10,hgt*0.5-24);g.fillRect(x+2,top+24+hgt*0.5,10,hgt*0.5-24)}
    if(o.carry){g.fillStyle='#1b1b1b';g.fillRect(x+12,top+hgt*0.45,22,16)}
    if(o.smoke){var f=.5+.5*Math.sin(t*3);g.fillStyle='rgba(255,140,60,'+(.4+.6*f)+')';g.beginPath();g.arc(x+16,top+18,2.5,0,Math.PI*2);g.fill()}
    if(o.paint||o.wash){var sw=Math.sin(t*(o.wash?9:4))*10;g.fillRect(x-30+sw,top+(o.wash?60:30),18,8)}
    g.restore()}
  function draw(cv,cl,t){
    var g=cv.getContext('2d'),W=640,H=360,cutting=cl.cut&&Math.abs(t-cl.cut[0])<.25;
    g.fillStyle='#3a3d3b';g.fillRect(0,0,W,H);g.font='12px JetBrains Mono, monospace';
    if(cl.bg==='hall'){
      g.fillStyle='#4a4d4a';g.fillRect(0,0,W,250);g.fillStyle='#2c2e2c';g.fillRect(0,250,W,110);
      g.fillStyle='#262826';g.fillRect(372,110,60,140);g.fillRect(536,110,60,140);
      g.fillStyle='#8a8a84';g.fillText('STUDY',384,100);g.fillText('OFFICE',546,100);
      g.fillStyle='#303230';g.fillRect(120,120,50,130);g.fillStyle='#5a5c58';g.fillRect(0,246,W,4);
      if(cl.n===1){var k=Math.min(1,t/7);g.fillStyle='#1d1f1d';for(var i=0;i<5;i++)g.fillRect(180+i*14,170+((i*37)%30),6,60*k)}
    }else if(cl.bg==='garden'){
      g.fillStyle='#1e2120';g.fillRect(0,0,W,H);g.fillStyle='#262a28';g.fillRect(0,250,W,110);
      g.fillStyle='#141615';for(var j=0;j<5;j++){g.beginPath();g.arc(60+j*140,170,60,0,Math.PI*2);g.fill()}
      var grd=g.createRadialGradient(480,90,4,480,90,140);grd.addColorStop(0,'rgba(200,200,170,.35)');grd.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=grd;g.fillRect(0,0,W,H);
      g.fillStyle='#555';g.fillRect(478,90,4,160);
    }else if(cl.bg==='kitchen'){
      g.fillStyle='#4b4e4b';g.fillRect(0,0,W,H);g.fillStyle='#343634';g.fillRect(0,260,W,100);
      g.fillStyle='#3d403d';g.fillRect(240,170,400,90);g.fillStyle='#2f312f';for(var m=0;m<4;m++)g.fillRect(250+m*96,180,88,74);
      var open=Math.max(0,Math.min(1,(t-1)/1));g.fillStyle='#0c0c0c';g.fillRect(538,180,88,74);g.fillStyle='#2f312f';g.fillRect(538+88*open*.8,180,88*(1-open*.8),74);
      g.fillStyle='#262826';g.fillRect(90,100,80,160);g.fillStyle='#8a8a84';g.fillText('PANTRY',98,94);g.fillStyle='#2f312f';g.fillRect(240,60,400,70);
    }else{
      g.fillStyle='#55585a';g.fillRect(0,0,W,H);g.fillStyle='#3a3c3c';g.fillRect(0,270,W,90);
      g.fillStyle='#6b6e6e';g.fillRect(250,200,160,30);g.fillStyle='#2c2e2e';g.fillRect(270,60,120,120);
    }
    if(!cutting)cl.actors.forEach(function(ac){var p=lerpK(ac.k,t);if(p[2]<=.01)return;
      var crouch=ac.crouch||(ac.crouchUntil&&t<ac.crouchUntil);
      var y=cl.bg==='kitchen'?(crouch&&ac.crouchUntil?256:300):(cl.bg==='wash'?320:300);
      figure(g,p[1],y,p[2],{cloak:ac.c==='cloak',crouch:crouch,carry:ac.carry&&t>=ac.carry[0]&&t<ac.carry[1],smoke:ac.smoke,paint:ac.paint,wash:ac.wash},t)});
    var img=g.getImageData(0,0,W,H),d=img.data;
    for(var q=0;q<d.length;q+=4){var nz=(Math.random()-.5)*(cutting?120:34);var v=(d[q]*.3+d[q+1]*.59+d[q+2]*.11)+nz;d[q]=d[q+1]=d[q+2]=v}
    g.putImageData(img,0,0);g.fillStyle='rgba(0,0,0,.18)';for(var y2=0;y2<H;y2+=3)g.fillRect(0,y2,W,1);
    g.fillStyle='#e8e8e0';g.font='600 16px JetBrains Mono, monospace';g.fillText(cl.cam,16,28);g.fillText(stamp(cl,t),W-246,H-18);
    if(Math.floor(t*2)%2===0){g.fillStyle='#d23';g.beginPath();g.arc(W-24,22,6,0,Math.PI*2);g.fill()}
  }

  render();
})();
